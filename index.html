<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Salaire 39H</title>
<style>body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:520px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #0f172a18;margin-top:18px}h1{font-size:32px;margin:8px 0}.sub{color:#64748b;line-height:1.5}button,a{display:block;width:100%;padding:15px;margin-top:12px;border-radius:14px;border:0;font:inherit;font-weight:800;text-align:center;text-decoration:none;box-sizing:border-box}.primary{background:#0f172a;color:white}.secondary{background:#e2e8f0;color:#0f172a}.note{font-size:13px;color:#64748b;line-height:1.5;margin-top:18px}</style></head>
<body><main><div class="card"><div>📱</div><h1>Salaire 39H</h1><p class="sub">Votre simulateur de vérification du salaire horaire, utilisable sur ordinateur, Android et iPhone.</p>
<a class="primary" href="app/">Ouvrir l'application</a><button id="install" class="secondary" hidden>Installer l'application</button>
<p class="note">Sur iPhone : ouvrez cette page avec Safari, puis « Partager » → « Sur l'écran d'accueil ». Sur Android : utilisez le bouton d'installation lorsqu'il est proposé.</p></div>
<script>let deferredPrompt;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.hidden=false});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.hidden=true});</script></main></body></html>
